<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner Nikah Afida &amp; Habib</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--bl1:rgba(244,166,195,.35);--bl2:rgba(255,214,229,.6);--glass:rgba(226,184,202,.55);--gb:rgba(190,100,140,.4);--tx:#2e101f;--mu:#6b3a54;--pk:#d9588a;--pk2:#f4a6c3;--ln:rgba(244,166,195,.3);--hero:#8c2f55;--inp:rgba(255,255,255,.85)}
:root[data-theme="dark"]{--bg:#150811;--bl1:rgba(217,88,138,.28);--bl2:rgba(140,60,110,.3);--glass:rgba(64,30,48,.5);--gb:rgba(255,160,200,.2);--tx:#fbe8f0;--mu:#cba0b5;--pk:#f08ab2;--pk2:#8a3d5c;--ln:rgba(255,160,200,.18);--hero:#ffd3e3;--inp:rgba(30,12,22,.7)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(650px 420px at 5% 0,var(--bl1),transparent),radial-gradient(560px 460px at 100% 45%,var(--bl2),transparent),var(--bg) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.glass,nav,.box,.st,.tw,.tl div{background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--gb)}
header{padding:6px 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{margin:0;font:800 20px Nunito,sans-serif}header p{margin:2px 0 0;font-size:12px;color:var(--mu)}
.tg{border:1px solid var(--gb);background:var(--glass);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;max-width:1280px;margin:0 auto;padding:14px}
nav{position:sticky;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;align-self:start;display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-radius:24px}
nav .br{padding:4px 10px 12px}nav .br small{display:block;font-size:12px;color:var(--mu)}nav .br b{font:italic 600 28px 'Cormorant Garamond',Georgia,serif;color:var(--hero)}
nav button{border:0;border-radius:16px;padding:10px 14px;background:transparent;color:var(--tx);text-align:left;cursor:pointer;font:700 14px Nunito,sans-serif}
nav button small{display:block;font:400 11px Nunito,sans-serif;color:var(--mu)}
nav button.on{background:linear-gradient(135deg,#b23c72,#7a1f48);color:#fff}nav button.on small{color:#ffd3e3}
@media(max-width:820px){.shell{grid-template-columns:1fr;padding:8px}nav{flex-direction:row;overflow-x:auto;top:env(safe-area-inset-top,0px);border-radius:0 0 18px 18px;padding:8px}nav .br{display:none}nav button{flex:none;white-space:nowrap}nav button small{display:none}}
main{padding:10px 4px 60px;min-width:0}
h2{font:italic 600 32px 'Cormorant Garamond',Georgia,serif;margin:6px 0 14px;color:var(--hero)}
h3{margin:0 0 10px;font:italic 600 24px 'Cormorant Garamond',Georgia,serif;color:var(--hero)}
.pc{display:flex;gap:18px;align-items:center;padding:18px;border-radius:24px}
.ph{flex:none;width:130px;height:160px;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mu);border:2px dashed var(--pk2);cursor:pointer;background:var(--inp)}
.ph img{width:100%;height:100%;object-fit:cover}.ph input{display:none}
.pc h1{font:italic 600 clamp(30px,6vw,46px)/1.05 'Cormorant Garamond',Georgia,serif;color:var(--hero);margin:6px 0}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--ln);font-size:12px;font-weight:700;color:var(--pk)}
.cdc{margin:14px 0;padding:20px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#f58fb4,#d9588a 70%,#c23d72)}
.cdc p{margin:0 0 12px;font-weight:700}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd div{text-align:center;padding:12px 4px;border-radius:16px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35)}
.cd b{display:block;font:600 32px 'Cormorant Garamond',Georgia,serif}.cd span{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:14px 0}
.st{padding:16px;border-radius:18px}.st.go{cursor:pointer}
.st b{display:block;font:600 24px 'Cormorant Garamond',Georgia,serif;color:var(--pk)}.st>span{font-size:13px;color:var(--mu)}
.bar{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pk2),var(--pk))}
.box{padding:16px;border-radius:20px;margin:14px 0}
.note{font-size:14px;color:var(--mu);margin:0 0 6px;line-height:1.55}
.dw{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.dn{position:relative;flex:none;width:220px;height:220px}.dn svg{width:100%;height:100%}
.dn div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dn b{font:800 18px Nunito,sans-serif;white-space:nowrap}.dn span{font-size:12px;color:var(--mu)}
.lg{flex:1;min-width:200px}.lg p{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.lg i{width:11px;height:11px;border-radius:50%;flex:none}.lg b{margin-left:auto;font-size:18px}.lg small{color:var(--mu);width:38px;text-align:right}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:12px;color:var(--mu);font-weight:700}
input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--gb);background:var(--inp);color:var(--tx);font:400 14px Nunito,sans-serif}
input:focus,select:focus,button:focus-visible,.ph:focus-within{outline:2px solid var(--pk);outline-offset:1px}
.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--pk2),var(--pk));color:#fff;font:800 14px Nunito,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pk);border:1px solid var(--pk)}
.tw{overflow-x:auto;border-radius:20px}
table{width:100%;border-collapse:collapse;min-width:600px}
th{text-align:left;font-size:12px;color:var(--mu);padding:12px 10px;border-bottom:1px solid var(--ln)}
td{padding:9px 10px;border-bottom:1px solid var(--ln);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.gh td{background:var(--ln);font-weight:800;cursor:pointer;color:var(--hero)}
.b{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ln);color:var(--tx)}
.b.g,.sl.g{background:#d8f3e3;color:#1f6b45}.b.y,.sl.y{background:#fff0c9;color:#7a5a05}.b.r,.sl.r{background:#ffd9e0;color:#a3274a}.b.b,.sl.b{background:#e8e6fb;color:#43449b}
.sl{width:auto;padding:4px 8px;border-radius:99px;font:700 12px Nunito,sans-serif;border:0}
.t{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--pk);background:transparent;color:var(--pk);font-size:16px;cursor:pointer}
.t.y1{background:var(--pk);color:#fff}.t.y2{background:#8a8a99;border-color:#8a8a99;color:#fff}
.ac{white-space:nowrap}.ac button{border:0;background:none;color:var(--pk);font:800 12px Nunito,sans-serif;cursor:pointer;padding:4px 6px}.ac button.x{color:#c0294f}
.cals{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.cm h4{margin:0 0 6px;font:800 14px Nunito,sans-serif;text-transform:capitalize}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}
.cg span{padding:5px 0;border-radius:8px}.cg .w{color:var(--mu);font-weight:700}
.cg .pd{background:#fff0c9;color:#7a5a05;font-weight:800}.cg .ok{background:#d8f3e3;color:#1f6b45;font-weight:800}.cg .late{background:#ffd9e0;color:#a3274a;font-weight:800}
.cg .hd{background:var(--pk);color:#fff;font-weight:800}.cg .td{outline:2px solid var(--pk);outline-offset:-2px}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(40,10,25,.4);backdrop-filter:blur(8px)}.ov[hidden],#cf[hidden]{display:none}
.empty{padding:26px;text-align:center;color:var(--mu)}
textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--gb);background:var(--inp);color:var(--tx);font:400 14px Nunito,sans-serif;resize:vertical}textarea:focus{outline:2px solid var(--pk)}
.cdn{color:#e0193f;background:rgba(224,25,63,.13);font-weight:800}
.b.dp,.sl.dp{background:#d6336f;color:#fff}.b.lp,.sl.lp{background:#ffd3e4;color:#a3274a}.b.bu,.sl.bu{background:#cfe3ff;color:#1f4f9a}
.sp{display:flex;align-items:center;gap:6px}.sp button{width:26px;height:26px;border-radius:50%;border:1px solid var(--pk);background:transparent;color:var(--pk);font-weight:800;cursor:pointer}.sp b{min-width:22px;text-align:center}
@media(max-width:560px){.pc{flex-direction:column;text-align:center}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell"><nav id="nav" aria-label="Halaman"></nav><div><header><div><h1>Halo, Afida &amp; Habib 👋</h1><p id="hd"></p></div><div style="display:flex;align-items:center;gap:8px"><span id="ss" class="note" style="margin:0"></span><button class="btn ghost" style="padding:6px 10px;font-size:12px" onclick="logout()">Keluar</button><button class="tg" onclick="th()" id="tg" aria-label="Ganti mode terang/gelap"></button></div></header>

<main id="app"></main></div></div>
<div id="lgn" class="ov" hidden><div class="box" style="max-width:340px;width:100%"><h3>Planner Afida &amp; Habib</h3><p class="note" id="lm">Masukkan kata sandi bersama.</p><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" style="margin-top:10px;width:100%" onclick="doLogin()">Masuk</button></div></div>
<div id="cf" class="box" hidden style="position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;max-width:440px;width:calc(100% - 28px)"><p class="note">Data sudah diubah dari perangkat lain. Pilih mana yang dipakai.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="useRemote()">Pakai data terbaru</button><button class="btn ghost" onclick="useMine()">Timpa dengan punyaku</button></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(+n||0);
const WD='2027-01-17',WT=Date.parse(WD+'T00:00:00+07:00'),KEY='nikah-afida-habib';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let PW='',REV=0,dirty=false,timer=null,online=false,CF=0;
try{PW=localStorage.getItem('nikah-pw')||''}catch(e){}
const sstat=t=>{const e=$('#ss');if(e)e.textContent=t};
const save=()=>{cache();dirty=true;sstat('Menyimpan…');clearTimeout(timer);timer=setTimeout(push,1500)};
const api=(m,b)=>fetch('/api/data',{method:m,headers:{'Authorization':'Bearer '+PW,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
async function push(){if(!online)return;try{const r=await api('PUT',{data:S,rev:REV});if(r.status===200){REV=(await r.json()).rev;dirty=false;sstat('Tersimpan ✓')}else if(r.status===409){conflict((await r.json()).rev)}else if(r.status===401){login('Kata sandi salah')}else sstat('Gagal menyimpan, coba lagi')}catch(e){sstat('Offline, tersimpan di perangkat ini')}}
async function pull(first){try{const r=await api('GET');
 if(r.status===401){online=false;login(PW?'Kata sandi salah':'');return}
 if(!r.ok){sstat('Mode lokal');return}
 const j=await r.json();online=true;
 if(!j.data){REV=j.rev||0;if(Object.keys(S).length)push();else sstat('Tersinkron ✓');return}
 if(j.rev<=REV)return;
 if(dirty&&!first){conflict(j.rev);return}
 S=j.data;REV=j.rev;cache();dirty=false;draw();sstat('Tersinkron ✓')
}catch(e){sstat('Mode lokal')}}
function conflict(rev){CF=rev;$('#cf').hidden=false;sstat('Perlu pilihan')}
async function useRemote(){$('#cf').hidden=true;dirty=false;REV=-1;await pull(true)}
function useMine(){$('#cf').hidden=true;REV=CF;push()}
function login(m){$('#lm').textContent=m||'Masukkan kata sandi bersama.';$('#lgn').hidden=false;$('#pw').value='';$('#pw').focus()}
function doLogin(){PW=$('#pw').value;try{localStorage.setItem('nikah-pw',PW)}catch(e){}$('#lgn').hidden=true;pull(true)}
function logout(){PW='';online=false;try{localStorage.removeItem('nikah-pw')}catch(e){}login('')}
try{document.documentElement.dataset.theme=localStorage.getItem('nikah-theme')||'light'}catch(e){}
const dd=d=>{if(!d)return null;const t=new Date();return Math.round((Date.parse(d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/864e5)};
const fd=d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'–';
const st=(l,v,k)=>`<div class="st${k?' go':''}"${k?` onclick="go('${k}')"`:''}><b>${v}</b><span>${l}</span></div>`;
const bar=p=>`<div class="bar"><i style="width:${Math.round(p)}%"></i></div>`;
const pct=(a,b)=>b?a/b*100:0;
const sum=(r,f)=>r.reduce((a,x)=>a+f(x),0);
const COL=['#ff4f9a','#ffb02e','#a678ff','#2ee6ff','#2dffc4','#ff5c7a','#e08bff','#5aa8ff','#c0c0d0'];
const glink=x=>S.link?S.link.replace(/\/+$/,'')+'/?to='+String(x.a).trim().split(/\s+/).map(encodeURIComponent).join('%20'):'';
const stat=(o,cl)=>({k:'s',l:'Status',t:'sel',o,cl});
function donut(parts,mid,sub){const tot=sum(parts,p=>p.v),C=389.56,ps=parts.filter(p=>p.v>0);let a=0,c='';
 if(!tot)c='<circle cx="80" cy="80" r="62" fill="none" stroke="var(--ln)" stroke-width="16"/>';
 else ps.forEach(p=>{const L=p.v/tot*C,one=ps.length===1,d=one?C:Math.max(1,L-22),o=one?0:a+11;a+=L;c+=`<circle cx="80" cy="80" r="62" fill="none" stroke="${p.c}" stroke-width="16" stroke-linecap="${one?'butt':'round'}" stroke-dasharray="${d} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 80 80)"/>`});
 return `<div class="dn"><svg viewBox="0 0 160 160" aria-hidden="true">${c}</svg><div><b>${mid}</b><span>${sub}</span></div></div>`}
function legend(parts,tot){return `<div class="lg">${parts.map(p=>`<p><i style="background:${p.c}"></i>${esc(p.l)}<b${p.r?' style="color:#e0193f"':''}>${rp(p.v)}</b><small>${tot?Math.round(p.v/tot*100):0}%</small></p>`).join('')}</div>`}
const totIn=()=>`<div class="st"><label>Total budget (Rp)<input type="number" min="0" value="${S.total||''}" placeholder="Isi total budget" onchange="S.total=+this.value;save();draw()"></label></div>`;

const PG={
checklist:{n:'Checklist & Timeline',done:r=>r.ok===1,f:[
 {k:'a',l:'Kegiatan',t:'text'},{k:'d',l:'Deadline',t:'date'},{k:'cd',l:'Countdown (hari)',t:'days',s:'d'},{k:'ok',l:'Checklist',t:'tick'},{k:'c',l:'Catatan',t:'note'}],
 seed:[{a:'Musyawarah keluarga dan tentukan konsep acara',d:'2026-11-07',c:'Libatkan kedua orang tua'},{a:'Tentukan budget total',d:'2026-11-14',c:'Isi di halaman Budget'},{a:'Survei dan booking lokasi akad/resepsi',d:'2026-11-21',c:''},{a:'Booking MUA dan dokumentasi',d:'2026-12-05',c:''}],
 sum:r=>{const n=r.filter(x=>x.ok===1).length;return `<div class="box"><h3>Timeline sampai hari H</h3>${cal()}</div><div class="box">${st('kegiatan selesai',n+' dari '+r.length)}${bar(pct(n,r.length))}<p class="note" style="margin-top:10px">Klik lingkaran untuk menandai: ✓ selesai, ✗ batal, ○ belum. Tanggal di kalender mengikuti deadline kegiatan.</p><button class="btn ghost" onclick="tlAll()">Tambah saran jadwal (H-180 s/d H-1)</button></div>`}},
budget:{n:'Budget Planner',f:[
 {k:'a',l:'Nama Item',t:'text'},{k:'g',l:'Kategori',t:'sel',o:['Lokasi & Gedung','Katering','Dekorasi','Busana & Rias','Dokumentasi','Undangan & Souvenir','Mahar & Seserahan','Transport','Lain-lain'],cl:['b']},{k:'h',l:'Harga',t:'money'},{k:'c',l:'Catatan',t:'note'}],
 sum:r=>{const C=PG.budget.f[1].o,m={},used=sum(r,x=>+x.h||0);r.forEach(x=>m[x.g]=(m[x.g]||0)+(+x.h||0));const parts=C.filter(c=>m[c]).map(c=>({l:c,v:m[c],c:COL[C.indexOf(c)]}));return `<div class="grid">${totIn()}${st('terpakai',`<span style="color:#e0193f">${rp(used)}</span>`)}${st('sisa budget',rp(Math.max(0,(S.total||0)-used)))}</div>`+(parts.length?`<div class="box dw">${donut(parts,`<span style="color:#e0193f">${rp(used)}</span>`,'terpakai')}${legend(parts,used)}</div>`:'')}},
vendor:{n:'Vendor',done:r=>r.p==='Lunas',f:[
 {k:'a',l:'Nama Vendor',t:'text'},{k:'e',l:'Deskripsi & Fasilitas',t:'area'},{k:'h',l:'Harga',t:'money'},{k:'p',l:'Pembayaran',t:'sel',o:['Belum','DP','Lunas'],cl:['r','y','g']},{k:'d',l:'Deadline',t:'date'},{k:'cd',l:'Countdown',t:'days',s:'d'}],
 sum:r=>`<div class="grid">${st('total biaya vendor',rp(sum(r,x=>+x.h||0)))}${st('sudah lunas',r.filter(x=>x.p==='Lunas').length+' dari '+r.length)}${st('baru DP',r.filter(x=>x.p==='DP').length)}${st('belum bayar',r.filter(x=>x.p==='Belum').length)}</div>`},
tamu:{n:'List Tamu',f:[
 {k:'a',l:'Nama Tamu',t:'text'},{k:'g',l:'Kategori Tamu',t:'sel',o:['Keluarga Afida','Keluarga Habib','Teman','Rekan Kerja','Tetangga','Lainnya'],cl:['b']},{k:'w',l:'Nomor WhatsApp',t:'tel'},{k:'q',l:'Jumlah Tamu',t:'step'},{k:'s',l:'RSVP',t:'sel',o:['Belum konfirmasi','Hadir','Tidak hadir'],cl:['y','g','r']},{k:'u',l:'Link Undangan',t:'ulink'}],
 sum:r=>{const q=s=>sum(r.filter(x=>x.s===s),x=>+x.q||0);return `<div class="box"><h3>Link undangan digital</h3><p class="note">Isi link undangan setelah jadi. Link tiap tamu terbentuk otomatis dari nama tamu (/?to=Nama%20Tamu) dan tombol Kirim WA membawa link itu.</p><div style="display:flex;gap:8px"><input id="lk" type="url" placeholder="https://undangan-digital.com/nama-mempelai" value="${esc(S.link||'')}" onkeydown="if(event.key==='Enter')svl()"><button class="btn" onclick="svl()">Simpan link</button></div><p class="note" style="margin:8px 0 0">Contoh hasil: <strong>${esc(S.link?glink({a:'Nama Tamu'}):'(isi link dulu)')}</strong></p></div><div class="grid">${st('total tamu diundang',sum(r,x=>+x.q||0)+' orang')}${st('akan hadir',q('Hadir')+' orang')}${st('tidak hadir',q('Tidak hadir')+' orang')}${st('belum konfirmasi',q('Belum konfirmasi')+' orang')}</div><div class="box"><form onsubmit="return false"><label>Cari tamu<input id="qs" type="text" placeholder="Nama atau nomor WA" value="${esc(fl.s)}" oninput="fl.s=this.value;draw()"></label><label>Kategori<select onchange="fl.g=this.value;draw()"><option value="">Semua kategori</option>${PG.tamu.f[1].o.map(o=>`<option${fl.g===o?' selected':''}>${esc(o)}</option>`).join('')}</select></label><label>RSVP<select onchange="fl.r=this.value;draw()"><option value="">Semua RSVP</option>${PG.tamu.f[4].o.map(o=>`<option${fl.r===o?' selected':''}>${esc(o)}</option>`).join('')}</select></label></form></div>`}},
seserahan:{n:'Mahar & Seserahan',grp:'g',f:[
 {k:'a',l:'Nama Item',t:'text'},{k:'g',l:'Kategori',t:'sel',o:['Mahar','Alat Shalat','Pakaian','Aksesoris','Hair Care','Body Care','Skincare','Make Up','Lainnya'],cl:['b']},{k:'br',l:'Brand',t:'text'},{k:'h',l:'Harga Satuan',t:'money'},{k:'q',l:'Quantity',t:'step'},{k:'z',l:'Harga Total',t:'total'},stat(['Belum','Masuk keranjang','Sudah check out','Sudah sampai'],['r','y','b','g']),{k:'l',l:'Link Online Shop',t:'url'}],

const TL=[[180,'Tentukan konsep, tanggal, dan budget pernikahan'],[150,'Survei dan booking lokasi akad/resepsi'],[120,'Pilih vendor: katering, dekorasi, MUA, dokumentasi'],[120,'Mulai urus dokumen (N1-N4, surat pengantar)'],[90,'Susun daftar tamu dan pesan busana'],[60,'Siapkan undangan dan souvenir'],[60,'Daftar ke KUA dan ikut bimbingan pranikah'],[45,'Bayar DP/pelunasan vendor dan beli seserahan'],[30,'Sebar undangan, fitting busana, foto pra-wedding'],[14,'Konfirmasi RSVP dan final jumlah tamu'],[7,'Gladi, siapkan mahar dan seserahan, briefing keluarga'],[1,'Istirahat, cek ulang dokumen dan perlengkapan']];
const tlDate=o=>new Date(Date.UTC(2027,0,17-o)).toISOString().slice(0,10);
const T=[['beranda','Beranda','Ringkasan utama'],['checklist','Checklist & Timeline','Tugas dan kalender'],['budget','Budget','Biaya dan pengeluaran'],['vendor','Vendor','Kontak dan deal'],['tamu','Tamu','Undangan dan RSVP'],['seserahan','Mahar & Seserahan','Belanja dan progres'],['dokumen','Dokumen','Berkas penting']];
const rows=k=>S[k]||(S[k]=JSON.parse(JSON.stringify(PG[k].seed||[])));
const srt=()=>rows('checklist').sort((a,b)=>(a.d||'9')<(b.d||'9')?-1:1);
let cur=(location.hash||'#beranda').slice(1),edit=-1,armed=-1,col={},fl={s:'',g:'',r:''};
if(!T.some(t=>t[0]===cur))cur='beranda';

function go(k){cur=k;edit=-1;armed=-1;location.hash=k;draw();scrollTo(0,0)}
function th(){const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('nikah-theme',n)}catch(e){}draw()}
function cal(){const ev={};rows('checklist').forEach(x=>{if(x.d)(ev[x.d]=ev[x.d]||[]).push(x)});
 const t=new Date(),a=t.getFullYear()*12+t.getMonth(),z=Math.max(a,2027*12),p=n=>String(n).padStart(2,'0'),tk=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;let h='<div class="cals">';
 for(let i=a;i<=z;i++){const y=Math.floor(i/12),m=i%12,off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  h+=`<div class="cm"><h4>${new Date(y,m,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h4><div class="cg">`+['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<span class="w">${d}</span>`).join('')+'<span></span>'.repeat(off);
  for(let d=1;d<=n;d++){const k=`${y}-${p(m+1)}-${p(d)}`,e=ev[k]||[];let c=e.length?(e.every(x=>x.ok===1||x.ok===2)?'ok':e.some(x=>x.ok!==1&&x.ok!==2)&&k<tk?'late':'pd'):'';if(k===WD)c='hd';if(k===tk)c+=' td';
   h+=`<span class="${c}" title="${esc(e.map(x=>x.a).join('; ')||(k===WD?'Hari pernikahan':''))}">${d}</span>`}
  h+='</div></div>'}
 return h+'</div><p class="note" style="margin-top:10px">Kuning: ada kegiatan · hijau: selesai · merah muda: lewat deadline · pink tua: hari H · garis: hari ini</p>'}

function cell(f,x,i){const v=x[f.k];switch(f.t){
 case 'date':return fd(v);
 case 'days':{if(PG[cur].done(x))return '<span class="b g">Selesai</span>';if(x.ok===2)return '<span class="b">Batal</span>';const n=dd(x[f.s]);if(n===null)return '–';return n<0?`<span class="b r">Lewat ${-n} hari</span>`:n===0?'<span class="b y">Hari ini</span>':`<span class="b cdn">${n} hari</span>`}
 case 'tick':return `<button class="t ${v===1?'y1':v===2?'y2':''}" onclick="tick(${i})" aria-label="Ubah status">${v===1?'✓':v===2?'✗':'○'}</button>`;
 case 'note':return v?`<em>${esc(v)}</em>`:'–';
 case 'money':return rp(v);
 case 'total':return rp((+x.h||0)*(+x.q||0));
 case 'sel':{const j=Math.max(0,f.o.indexOf(v||f.o[0]));return `<select class="sl ${f.cl[Math.min(j,f.cl.length-1)]}" onchange="setv(${i},'${f.k}',this.value)" aria-label="${f.l}">${f.o.map((o,q)=>`<option${q===j?' selected':''}>${esc(o)}</option>`).join('')}</select>`}
 case 'tel':{if(!v)return '–';let n=String(v).replace(/\D/g,'');if(n[0]==='0')n='62'+n.slice(1);return `<a href="https://wa.me/${n}" target="_blank" rel="noopener" style="color:var(--pk)">${esc(v)}</a>`}
 case 'area':return v?`<div style="white-space:pre-wrap;min-width:200px;max-width:340px">${esc(v)}</div>`:'–';
 case 'url':return v&&/^https?:\/\//i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener" style="color:var(--pk);font-weight:700">Buka toko ↗</a>`:'–';
 case 'step':return `<div class="sp"><button onclick="stp(${i},'${f.k}',-1)" aria-label="Kurangi">−</button><b>${v||0}</b><button onclick="stp(${i},'${f.k}',1)" aria-label="Tambah">+</button></div>`;
 case 'ulink':{const l=glink(x);if(!l)return '<span class="note">Isi link undangan di atas</span>';let n=String(x.w||'').replace(/\D/g,'');if(n[0]==='0')n='62'+n.slice(1);const m=encodeURIComponent(pesan(x,l));
  // ===== TEKS PESAN WHATSAPP: edit di antara tanda ` ` di bawah ini =====
// {link} = link undangan otomatis per tamu, {nama} = nama tamu.
const PESAN=`_Assalamu’alaikum Warahmatullahi Wabarakatuh_

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami.

{link}

Merupakan suatu kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan untuk hadir dan memberikan do’a restu.

Terimakasih banyak atas perhatiannya☺️

_Wassalamu’alaikum Warahmatullahi Wabarakatuh_

Hormat Kami,
*Afida & Habib*`;
const pesan=(x,l)=>PESAN.split('{link}').join(l).split('{nama}').join(x.a);
  ;return `<div style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn ghost" style="padding:5px 9px;font-size:12px" onclick="cp(${i},this)">Salin</button><a class="btn" style="padding:6px 9px;font-size:12px;text-decoration:none;display:inline-block" href="https://wa.me/${n}?text=${m}" target="_blank" rel="noopener">Kirim WA</a></div>`}
 default:return esc(v)}}

function page(k){const p=PG[k],r=rows(k),e=edit>=0?r[edit]:{};
 const inp=p.f.filter(f=>!['days','total','tick','ulink'].includes(f.t));
 let h=`<h2>${p.n}</h2>`+p.sum(r);
 h+=`<div class="box"><form onsubmit="return add(event)">`+inp.map((f,j)=>{const v=e[f.k]==null?'':e[f.k],ty=f.t==='date'?'date':f.t==='money'||f.t==='num'||f.t==='step'?'number':f.t==='tel'?'tel':f.t==='url'?'url':'text';
  return `<label${f.t==='area'?' style="grid-column:1/-1"':''}>${f.l}${f.t==='area'?`<textarea name="${f.k}" rows="4" placeholder="Tulis fasilitas, paket, syarat, dan keterangan lain">${esc(v)}</textarea>`:f.t==='sel'?`<select name="${f.k}">${f.o.map(o=>`<option${(v||f.o[0])===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${f.k}" type="${ty}" value="${esc(v)}"${ty==='number'?' min="0" step="any"':''}${j===0?' required':''}>`}</label>`}).join('')
  +`<div style="display:flex;gap:8px"><button class="btn">${edit>=0?'Simpan perubahan':'Tambah'}</button>${edit>=0?'<button type="button" class="btn ghost" onclick="edit=-1;draw()">Batal</button>':''}</div></form></div>`;
 if(!r.length)return h+`<div class="box empty">Belum ada data. Isi formulir di atas untuk menambah.</div>`;
 let ord=r.map((x,i)=>i);if(p.grp){const o=p.f.find(f=>f.k===p.grp).o;ord.sort((a,b)=>o.indexOf(r[a][p.grp])-o.indexOf(r[b][p.grp]))}
 if(k==='tamu')ord=ord.filter(i=>{const x=r[i],s=fl.s.toLowerCase();return(!s||String(x.a).toLowerCase().includes(s)||String(x.w||'').includes(s))&&(!fl.g||x.g===fl.g)&&(!fl.r||x.s===fl.r)});
 let last=null,body='';
 ord.forEach(i=>{const x=r[i];if(p.grp&&x[p.grp]!==last){last=x[p.grp];const q=r.filter(y=>y[p.grp]===last).length;body+=`<tr class="gh" data-g="${esc(last)}" onclick="tg(this.dataset.g)"><td colspan="${p.f.length+1}">${col[k+last]?'▸':'▾'} ${esc(last||'Tanpa kategori')} · ${q} item</td></tr>`}
  if(p.grp&&col[k+last])return;
  body+=`<tr>${p.f.map(f=>`<td>${cell(f,x,i)}</td>`).join('')}<td class="ac"><button onclick="ed(${i})">Edit</button><button class="x" onclick="del(${i})">${armed===i?'Yakin?':'Hapus'}</button></td></tr>`});
 return h+`<div class="tw"><table><thead><tr>${p.f.map(f=>`<th>${f.l}</th>`).join('')}<th></th></tr></thead><tbody>${body}</tbody></table></div>`}

function add(ev){ev.preventDefault();const p=PG[cur],r=rows(cur),f=new FormData(ev.target),o=edit>=0?r[edit]:{};
 p.f.forEach(x=>{if(!f.has(x.k))return;let v=f.get(x.k);if(x.t==='money'||x.t==='num'||x.t==='step')v=v===''?0:+v;if(x.t==='url'&&v&&!/^https?:\/\//i.test(v))v='https://'+v;o[x.k]=v});
 if(edit<0){if(p.f.some(x=>x.k==='s'&&!o.s))o.s=p.f.find(x=>x.k==='s').o[0];r.push(o)}
 edit=-1;armed=-1;if(cur==='checklist')srt();save();draw();return false}
const ed=i=>{edit=i;armed=-1;draw();scrollTo(0,0)};
function del(i){if(armed===i){rows(cur).splice(i,1);armed=-1;edit=-1;save()}else armed=i;draw()}
function tick(i){const x=rows(cur)[i];x.ok=x.ok===1?2:x.ok===2?0:1;save();draw()}
function setv(i,k,v){rows(cur)[i][k]=v;save();draw()}
function tg(g){col[cur+g]=!col[cur+g];draw()}
function stp(i,k,d){const x=rows(cur)[i];x[k]=Math.max(0,(+x[k]||0)+d);save();draw()}
function svl(){let v=$('#lk').value.trim().replace(/[?#].*$/,'').replace(/\/+$/,'');if(v&&!/^https?:\/\//i.test(v))v='https://'+v;S.link=v;save();draw()}
function cp(i,b){const l=glink(rows('tamu')[i]),ok=()=>{b.textContent='Tersalin ✓'};try{navigator.clipboard.writeText(l).then(ok,()=>prompt('Salin link:',l))}catch(e){prompt('Salin link:',l)}}
function tlAll(){const r=rows('checklist');TL.forEach(t=>{if(dd(tlDate(t[0]))>=0&&!r.some(x=>x.a===t[1]))r.push({a:t[1],d:tlDate(t[0]),c:''})});srt();save();draw()}
function pho(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,600/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.foto=c.toDataURL('image/jpeg',.82);save();draw()};im.src=rd.result};rd.readAsDataURL(f)}

function home(){const ck=rows('checklist'),tm=rows('tamu'),ses=rows('seserahan'),dk=rows('dokumen'),bd=rows('budget'),vn=rows('vendor');
 const used=sum(bd,x=>+x.h||0),tot=S.total||0,sisa=Math.max(0,tot-used),parts=[{l:'Terpakai',v:tot?Math.min(used,tot):used,c:'#ff3b6b',r:1},{l:'Sisa budget',v:sisa,c:'#2dffc4'}];
 const nx=[...ck.filter(x=>x.ok!==1&&x.ok!==2&&x.d).map(x=>({a:x.a,d:x.d})),...vn.filter(x=>x.p!=='Lunas'&&x.d).map(x=>({a:'Bayar vendor: '+x.a,d:x.d}))].sort((a,b)=>a.d<b.d?-1:1).slice(0,4);
 return `<section class="pc glass"><label class="ph">${S.foto?`<img src="${S.foto}" alt="Foto calon pengantin">`:'📷<br>Tambah foto<br>calon pengantin'}<input type="file" accept="image/*" onchange="pho(this)"></label>
 <div><span class="chip">♥ Menuju hari bahagia</span><h1>Afida Nur Sholikah &amp; Muhammad Habib</h1><div class="note">Akad: Minggu, 17 Januari 2027</div></div></section>
 <section class="cdc"><p>Hitung mundur hari bahagia</p><div class="cd" id="cd"></div></section>

 <div class="grid">${st('checklist selesai',ck.filter(x=>x.ok===1).length+'/'+ck.length,'checklist')}${st('vendor lunas',vn.filter(x=>x.p==='Lunas').length+'/'+vn.length,'vendor')}${st('tamu akan hadir',sum(tm.filter(x=>x.s==='Hadir'),x=>+x.q||0)+' orang','tamu')}${st('seserahan sampai',ses.filter(x=>x.s==='Sudah sampai').length+'/'+ses.length,'seserahan')}${st('dokumen siap',dk.filter(x=>x.s==='Siap').length+'/'+dk.length,'dokumen')}</div>
 <div class="box"><h3>Timeline persiapan</h3>${cal()}</div>
 <div class="box"><h3>Deadline terdekat</h3>${nx.length?nx.map(x=>{const n=dd(x.d);return `<p class="note">${esc(x.a)} · <strong style="color:#e0193f">${n<0?'lewat '+(-n)+' hari':n===0?'hari ini':n+' hari lagi'}</strong></p>`}).join(''):'<p class="note">Belum ada deadline. Mulai dari Checklist & Timeline.</p>'}</div>
 <p class="note" style="text-align:center">Data tersimpan di browser perangkat ini saja.</p>`}

function tick1(){const e=$('#cd');if(!e)return;const s=Math.max(0,Math.floor((WT-Date.now())/1000)),v=[[Math.floor(s/86400),'hari'],[Math.floor(s%86400/3600),'jam'],[Math.floor(s%3600/60),'menit'],[s%60,'detik']];e.innerHTML=v.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}

 $('#tg').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';

 const fo=document.activeElement&&document.activeElement.id==='qs';$('#app').innerHTML=cur==='beranda'?home():page(cur);tick1();if(fo){const e=$('#qs');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}}
addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(T.some(t=>t[0]===k)&&k!==cur){cur=k;edit=-1;draw()}});
setInterval(tick1,1000);setInterval(()=>{if(online&&!document.hidden)pull(false)},45000);draw();pull(true);
